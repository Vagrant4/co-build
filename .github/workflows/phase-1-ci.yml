name: Phase 1 release gate

on:
  push:
    branches:
      - codex/production-foundation-phase-1
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      APP_MODE: demo
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/co_build_ci
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        shell: bash
        run: |
          set +e
          npm ci > npm-ci.log 2>&1
          status=$?
          cat npm-ci.log
          if [ "$status" -ne 0 ]; then
            message=$( (head -n 30 npm-ci.log; tail -n 10 npm-ci.log) | tr '\n' ' ' | sed 's/%/%25/g')
            echo "::error title=npm ci failed::$message"
            exit "$status"
          fi
      - run: npx prisma validate
      - run: npm run prisma:generate:prod
      - run: npm run prisma:generate
      - run: npm test
      - run: npm run test:auth
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx prisma db push
      - run: npm run db:seed
      - run: npm run test:e2e
